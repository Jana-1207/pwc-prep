<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif">
<text x="10" y="24" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#13294B" text-anchor="start">1. Authentication — WHO are you?</text>
<rect x="10" y="40" width="128" height="50" rx="7" fill="#F2F4F7" stroke="#667085" stroke-width="1.3"/>
<text x="74" y="55.2" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11" font-weight="600" fill="#1D2939" text-anchor="middle">User</text>
<text x="74" y="69.9" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="8.8" font-weight="400" fill="#5B6575" text-anchor="middle">email + password</text>
<text x="74" y="81.3" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="8.8" font-weight="400" fill="#5B6575" text-anchor="middle">or OTP / Google</text>
<line x1="140" y1="65" x2="208.8" y2="65" stroke="#475467" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="214,65 206.5,61.4 206.5,68.6" fill="#475467" stroke="none" stroke-width="1"/>
<rect x="164.3" y="50.9" width="25.4" height="14.2" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="177" y="61.1" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9" font-weight="500" fill="#344054" text-anchor="middle">login</text>
<rect x="216" y="40" width="168" height="50" rx="7" fill="#13294B" stroke="#13294B" stroke-width="1.3"/>
<text x="300" y="60.8" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Auth server / API</text>
<text x="300" y="75.6" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#C9D5E8" text-anchor="middle">verifies identity</text>
<line x1="386" y1="65" x2="464.8" y2="65" stroke="#475467" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="470,65 462.5,61.4 462.5,68.6" fill="#475467" stroke="none" stroke-width="1"/>
<rect x="411.8" y="50.9" width="32.4" height="14.2" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="428" y="61.1" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9" font-weight="500" fill="#344054" text-anchor="middle">issues</text>
<rect x="472" y="40" width="236" height="50" rx="7" fill="#FFF8E6" stroke="#C27803" stroke-width="1.3"/>
<text x="590" y="60.8" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11" font-weight="600" fill="#7A4B02" text-anchor="middle">Token (JWT)</text>
<text x="590" y="75.6" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#5B6575" text-anchor="middle">user_id=7, role=customer, exp=1h</text>
<text x="10" y="134" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#13294B" text-anchor="start">2. Authorization — WHAT are you allowed to do?</text>
<rect x="10" y="150" width="178" height="54" rx="7" fill="#EAF2FB" stroke="#1F5FA8" stroke-width="1.3"/>
<text x="99" y="172.9" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="10" font-weight="600" fill="#13294B" text-anchor="middle">DELETE /api/products/5</text>
<text x="99" y="186.9" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="8.4" font-weight="400" fill="#5B6575" text-anchor="middle">Authorization: Bearer &lt;JWT&gt;</text>
<line x1="190" y1="177" x2="248.8" y2="177" stroke="#475467" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="254,177 246.5,173.4 246.5,180.6" fill="#475467" stroke="none" stroke-width="1"/>
<rect x="256" y="150" width="168" height="54" rx="7" fill="#EAF2FB" stroke="#1F5FA8" stroke-width="1.3"/>
<text x="340" y="172.8" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11" font-weight="600" fill="#13294B" text-anchor="middle">Permission check</text>
<text x="340" y="187.6" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#5B6575" text-anchor="middle">does role allow this?</text>
<rect x="474" y="140" width="234" height="34" rx="7" fill="#EAF7EF" stroke="#2F7A4D" stroke-width="1.3"/>
<text x="591" y="160" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="10.2" font-weight="600" fill="#1F5136" text-anchor="middle">role = admin  →  204 No Content</text>
<rect x="474" y="182" width="234" height="34" rx="7" fill="#FEF0EF" stroke="#B42318" stroke-width="1.3"/>
<text x="591" y="202" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="10.2" font-weight="600" fill="#7A1A12" text-anchor="middle">role = customer  →  403 Forbidden</text>
<line x1="426" y1="168" x2="467.9" y2="158" stroke="#475467" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="472,157 465.5,155.6 466.8,161.2" fill="#475467" stroke="none" stroke-width="1"/>
<line x1="426" y1="186" x2="468" y2="197.9" stroke="#475467" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="472,199 467,194.6 465.4,200.1" fill="#475467" stroke="none" stroke-width="1"/>
<text x="360" y="232" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9.6" font-weight="600" fill="#B5520C" text-anchor="middle">No / invalid token → 401 Unauthorized (really means 'unauthenticated').</text>
</svg>
