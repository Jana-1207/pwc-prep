<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif">
<rect x="120" y="14" width="230" height="52" rx="7" fill="#F2F4F7" stroke="#667085" stroke-width="1.3"/>
<text x="235" y="35.6" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="600" fill="#1D2939" text-anchor="middle">User</text>
<text x="235" y="51.8" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#5B6575" text-anchor="middle">customer on a phone or laptop</text>
<rect x="120" y="104" width="230" height="52" rx="7" fill="#EAF2FB" stroke="#1F5FA8" stroke-width="1.3"/>
<text x="235" y="125.6" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="600" fill="#13294B" text-anchor="middle">Frontend</text>
<text x="235" y="141.8" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#5B6575" text-anchor="middle">web page / mobile app (the UI)</text>
<rect x="120" y="194" width="230" height="52" rx="7" fill="#EAF2FB" stroke="#1F5FA8" stroke-width="1.3"/>
<text x="235" y="215.6" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="600" fill="#13294B" text-anchor="middle">Backend / API</text>
<text x="235" y="231.8" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#5B6575" text-anchor="middle">business rules + REST endpoints</text>
<path d="M120,290.6 A115,10.6 0 0 1 350,290.6 L350,335.4 A115,10.6 0 0 1 120,335.4 Z" fill="#E7F6F3" stroke="#0F766E" stroke-width="1.3" stroke-linejoin="round"/>
<ellipse cx="235" cy="290.6" rx="115" ry="10.6" fill="#E7F6F3" stroke="#0F766E" stroke-width="1.3"/>
<text x="235" y="313.9" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="600" fill="#0B4F4A" text-anchor="middle">Database</text>
<text x="235" y="330.1" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#5B6575" text-anchor="middle">PostgreSQL / MySQL / MongoDB</text>
<rect x="120" y="420" width="230" height="52" rx="7" fill="#F2EDFC" stroke="#6941C6" stroke-width="1.3"/>
<text x="235" y="441.6" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="600" fill="#3E1F8C" text-anchor="middle">Analytics</text>
<text x="235" y="457.8" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#5B6575" text-anchor="middle">data warehouse + dashboards</text>
<line x1="221" y1="68" x2="221" y2="96.8" stroke="#475467" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="221,102 224.6,94.5 217.4,94.5" fill="#475467" stroke="none" stroke-width="1"/>
<line x1="249" y1="102" x2="249" y2="73.2" stroke="#667085" stroke-width="1.4" stroke-dasharray="4 3" stroke-linecap="round"/>
<polygon points="249,68 245.4,75.5 252.6,75.5" fill="#667085" stroke="none" stroke-width="1"/>
<text x="211" y="89" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="10" font-weight="500" fill="#344054" text-anchor="end">taps 'Place order'</text>
<text x="259" y="89" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#5B6575" text-anchor="start" font-style="italic">sees confirmation</text>
<line x1="221" y1="158" x2="221" y2="186.8" stroke="#475467" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="221,192 224.6,184.5 217.4,184.5" fill="#475467" stroke="none" stroke-width="1"/>
<line x1="249" y1="192" x2="249" y2="163.2" stroke="#667085" stroke-width="1.4" stroke-dasharray="4 3" stroke-linecap="round"/>
<polygon points="249,158 245.4,165.5 252.6,165.5" fill="#667085" stroke="none" stroke-width="1"/>
<text x="211" y="179" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="10" font-weight="500" fill="#344054" text-anchor="end">HTTP request (JSON)</text>
<text x="259" y="179" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#5B6575" text-anchor="start" font-style="italic">JSON response</text>
<line x1="221" y1="248" x2="221" y2="272.8" stroke="#475467" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="221,278 224.6,270.5 217.4,270.5" fill="#475467" stroke="none" stroke-width="1"/>
<line x1="249" y1="278" x2="249" y2="253.2" stroke="#667085" stroke-width="1.4" stroke-dasharray="4 3" stroke-linecap="round"/>
<polygon points="249,248 245.4,255.5 252.6,255.5" fill="#667085" stroke="none" stroke-width="1"/>
<text x="211" y="267" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="10" font-weight="500" fill="#344054" text-anchor="end">SQL query</text>
<text x="259" y="267" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#5B6575" text-anchor="start" font-style="italic">rows / result</text>
<line x1="235" y1="348" x2="235" y2="412.8" stroke="#475467" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="235,418 238.6,410.5 231.4,410.5" fill="#475467" stroke="none" stroke-width="1"/>
<text x="247" y="380" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="10" font-weight="500" fill="#344054" text-anchor="start">data copied by a pipeline</text>
<text x="247" y="394" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#5B6575" text-anchor="start">(nightly ETL or streaming)</text>
<rect x="480" y="180" width="225" height="80" rx="7" fill="#FFFFFF" stroke="#98A2B3" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="592.5" y="209.1" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="600" fill="#344054" text-anchor="middle">Other services</text>
<text x="592.5" y="225.3" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#5B6575" text-anchor="middle">payment gateway · SMS / email</text>
<text x="592.5" y="238.3" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#5B6575" text-anchor="middle">maps · inventory · auth</text>
<line x1="357.2" y1="213" x2="472.8" y2="213" stroke="#475467" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="478,213 470.5,209.4 470.5,216.6" fill="#475467" stroke="none" stroke-width="1"/>
<polygon points="352,213 359.5,216.6 359.5,209.4" fill="#475467" stroke="none" stroke-width="1"/>
<text x="415" y="205" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="10" font-weight="500" fill="#344054" text-anchor="middle">API calls</text>
<text x="415" y="232" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9.5" font-weight="400" fill="#5B6575" text-anchor="middle">(HTTPS + JSON)</text>
<text x="482" y="300" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="10.5" font-weight="600" fill="#13294B" text-anchor="start">Example: food-delivery order</text>
<text x="482" y="316" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9.6" font-weight="400" fill="#5B6575" text-anchor="start">1. user taps 'Order'</text>
<text x="482" y="332" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9.6" font-weight="400" fill="#5B6575" text-anchor="start">2. app sends the order as JSON</text>
<text x="482" y="348" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9.6" font-weight="400" fill="#5B6575" text-anchor="start">3. API validates it and saves it (SQL)</text>
<text x="482" y="364" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9.6" font-weight="400" fill="#5B6575" text-anchor="start">4. API calls the payment gateway</text>
<text x="482" y="380" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9.6" font-weight="400" fill="#5B6575" text-anchor="start">5. order is copied to the warehouse</text>
<text x="482" y="396" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9.6" font-weight="400" fill="#5B6575" text-anchor="start">    for 'orders per city' dashboards</text>
</svg>
