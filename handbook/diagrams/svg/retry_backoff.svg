<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170" width="720" height="170" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif">
<line x1="20" y1="80" x2="700" y2="80" stroke="#C8D1DD" stroke-width="2" stroke-linecap="round"/>
<rect x="0" y="58" width="68" height="44" rx="7" fill="#FEF0EF" stroke="#B42318" stroke-width="1.3"/>
<text x="34" y="75.8" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11" font-weight="600" fill="#7A1A12" text-anchor="middle">try 1</text>
<text x="34" y="90.6" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#5B6575" text-anchor="middle">503 error</text>
<text x="114" y="74" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="10" font-weight="600" fill="#B5520C" text-anchor="middle">wait 1s</text>
<rect x="150" y="58" width="68" height="44" rx="7" fill="#FEF0EF" stroke="#B42318" stroke-width="1.3"/>
<text x="184" y="75.8" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11" font-weight="600" fill="#7A1A12" text-anchor="middle">try 2</text>
<text x="184" y="90.6" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#5B6575" text-anchor="middle">503 error</text>
<text x="284" y="74" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="10" font-weight="600" fill="#B5520C" text-anchor="middle">wait 2s</text>
<rect x="350" y="58" width="68" height="44" rx="7" fill="#FEF0EF" stroke="#B42318" stroke-width="1.3"/>
<text x="384" y="75.8" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11" font-weight="600" fill="#7A1A12" text-anchor="middle">try 3</text>
<text x="384" y="90.6" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#5B6575" text-anchor="middle">503 error</text>
<text x="524" y="74" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="10" font-weight="600" fill="#B5520C" text-anchor="middle">wait 4s</text>
<rect x="610" y="58" width="68" height="44" rx="7" fill="#EAF7EF" stroke="#2F7A4D" stroke-width="1.3"/>
<text x="644" y="75.8" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11" font-weight="600" fill="#1F5136" text-anchor="middle">try 4</text>
<text x="644" y="90.6" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#5B6575" text-anchor="middle">200 OK</text>
<path d="M70,106 Q107.5,150 145,106" fill="none" stroke="#98A2B3" stroke-width="1.1" stroke-dasharray="4 3" stroke-linejoin="round"/>
<path d="M220,106 Q282.5,150 345,106" fill="none" stroke="#98A2B3" stroke-width="1.1" stroke-dasharray="4 3" stroke-linejoin="round"/>
<path d="M420,106 Q512.5,150 605,106" fill="none" stroke="#98A2B3" stroke-width="1.1" stroke-dasharray="4 3" stroke-linejoin="round"/>
<text x="360" y="32" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="10" font-weight="600" fill="#13294B" text-anchor="middle">Exponential backoff: wait 1s, 2s, 4s … (+ random jitter) and give up after a few tries.</text>
<text x="360" y="164" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9.6" font-weight="400" fill="#5B6575" text-anchor="middle" font-style="italic">Only retry safe/idempotent operations, or use an idempotency key.</text>
</svg>
