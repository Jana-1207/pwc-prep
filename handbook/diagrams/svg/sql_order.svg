<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 362" width="720" height="362" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif">
<text x="125" y="24" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#13294B" text-anchor="middle">How you WRITE it</text>
<text x="415" y="24" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#13294B" text-anchor="middle">How the database RUNS it</text>
<rect x="40" y="44" width="170" height="32" rx="7" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="1.3"/>
<text x="125" y="63.3" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11.5" font-weight="600" fill="#344054" text-anchor="middle">SELECT</text>
<rect x="40" y="88" width="170" height="32" rx="7" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="1.3"/>
<text x="125" y="107.3" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11.5" font-weight="600" fill="#344054" text-anchor="middle">FROM / JOIN</text>
<rect x="40" y="132" width="170" height="32" rx="7" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="1.3"/>
<text x="125" y="151.3" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11.5" font-weight="600" fill="#344054" text-anchor="middle">WHERE</text>
<rect x="40" y="176" width="170" height="32" rx="7" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="1.3"/>
<text x="125" y="195.3" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11.5" font-weight="600" fill="#344054" text-anchor="middle">GROUP BY</text>
<rect x="40" y="220" width="170" height="32" rx="7" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="1.3"/>
<text x="125" y="239.3" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11.5" font-weight="600" fill="#344054" text-anchor="middle">HAVING</text>
<rect x="40" y="264" width="170" height="32" rx="7" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="1.3"/>
<text x="125" y="283.3" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11.5" font-weight="600" fill="#344054" text-anchor="middle">ORDER BY</text>
<rect x="40" y="308" width="170" height="32" rx="7" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="1.3"/>
<text x="125" y="327.3" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11.5" font-weight="600" fill="#344054" text-anchor="middle">LIMIT / OFFSET</text>
<rect x="330" y="44" width="170" height="32" rx="7" fill="#EAF2FB" stroke="#1F5FA8" stroke-width="1.3"/>
<text x="415" y="63.3" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11.5" font-weight="600" fill="#13294B" text-anchor="middle">1. FROM / JOIN</text>
<text x="512" y="64" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9.6" font-weight="400" fill="#5B6575" text-anchor="start">collect rows from the tables</text>
<rect x="330" y="88" width="170" height="32" rx="7" fill="#EAF2FB" stroke="#1F5FA8" stroke-width="1.3"/>
<text x="415" y="107.3" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11.5" font-weight="600" fill="#13294B" text-anchor="middle">2. WHERE</text>
<text x="512" y="108" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9.6" font-weight="400" fill="#5B6575" text-anchor="start">drop rows that fail the condition</text>
<rect x="330" y="132" width="170" height="32" rx="7" fill="#EAF2FB" stroke="#1F5FA8" stroke-width="1.3"/>
<text x="415" y="151.3" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11.5" font-weight="600" fill="#13294B" text-anchor="middle">3. GROUP BY</text>
<text x="512" y="152" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9.6" font-weight="400" fill="#5B6575" text-anchor="start">make one group per key value</text>
<rect x="330" y="176" width="170" height="32" rx="7" fill="#EAF2FB" stroke="#1F5FA8" stroke-width="1.3"/>
<text x="415" y="195.3" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11.5" font-weight="600" fill="#13294B" text-anchor="middle">4. HAVING</text>
<text x="512" y="196" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9.6" font-weight="400" fill="#5B6575" text-anchor="start">drop groups that fail the condition</text>
<rect x="330" y="220" width="170" height="32" rx="7" fill="#DCEBFB" stroke="#1F5FA8" stroke-width="1.3"/>
<text x="415" y="239.3" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11.5" font-weight="600" fill="#13294B" text-anchor="middle">5. SELECT</text>
<text x="512" y="240" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9.6" font-weight="400" fill="#5B6575" text-anchor="start">compute columns, aliases, DISTINCT</text>
<rect x="330" y="264" width="170" height="32" rx="7" fill="#EAF2FB" stroke="#1F5FA8" stroke-width="1.3"/>
<text x="415" y="283.3" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11.5" font-weight="600" fill="#13294B" text-anchor="middle">6. ORDER BY</text>
<text x="512" y="284" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9.6" font-weight="400" fill="#5B6575" text-anchor="start">sort the result (can use aliases)</text>
<rect x="330" y="308" width="170" height="32" rx="7" fill="#EAF2FB" stroke="#1F5FA8" stroke-width="1.3"/>
<text x="415" y="327.3" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11.5" font-weight="600" fill="#13294B" text-anchor="middle">7. LIMIT / OFFSET</text>
<text x="512" y="328" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9.6" font-weight="400" fill="#5B6575" text-anchor="start">keep only the rows asked for</text>
<line x1="212" y1="60" x2="325.7" y2="232.5" stroke="#B5520C" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="328,236 327.1,229.4 322.3,232.6" fill="#B5520C" stroke="none" stroke-width="1"/>
<line x1="212" y1="104" x2="324.1" y2="61.5" stroke="#98A2B3" stroke-width="1.1" stroke-linecap="round"/>
<polygon points="328,60 321.4,59.4 323.4,64.8" fill="#98A2B3" stroke="none" stroke-width="1"/>
<line x1="212" y1="148" x2="324.1" y2="105.5" stroke="#98A2B3" stroke-width="1.1" stroke-linecap="round"/>
<polygon points="328,104 321.4,103.4 323.4,108.8" fill="#98A2B3" stroke="none" stroke-width="1"/>
<line x1="212" y1="192" x2="324.1" y2="149.5" stroke="#98A2B3" stroke-width="1.1" stroke-linecap="round"/>
<polygon points="328,148 321.4,147.4 323.4,152.8" fill="#98A2B3" stroke="none" stroke-width="1"/>
<line x1="212" y1="236" x2="324.1" y2="193.5" stroke="#98A2B3" stroke-width="1.1" stroke-linecap="round"/>
<polygon points="328,192 321.4,191.4 323.4,196.8" fill="#98A2B3" stroke="none" stroke-width="1"/>
<line x1="212" y1="280" x2="323.8" y2="280" stroke="#98A2B3" stroke-width="1.1" stroke-linecap="round"/>
<polygon points="328,280 322,277.1 322,282.9" fill="#98A2B3" stroke="none" stroke-width="1"/>
<line x1="212" y1="324" x2="323.8" y2="324" stroke="#98A2B3" stroke-width="1.1" stroke-linecap="round"/>
<polygon points="328,324 322,321.1 322,326.9" fill="#98A2B3" stroke="none" stroke-width="1"/>
<text x="360" y="352" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9.8" font-weight="600" fill="#B5520C" text-anchor="middle">SELECT runs after WHERE — that is why a column alias from SELECT cannot be used in WHERE.</text>
</svg>
