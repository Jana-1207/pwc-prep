<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif">
<rect x="8" y="42" width="86" height="50" rx="7" fill="#13294B" stroke="#13294B" stroke-width="1.3"/>
<text x="51" y="70.5" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">BEGIN</text>
<rect x="118" y="28" width="186" height="78" rx="7" fill="#EAF2FB" stroke="#1F5FA8" stroke-width="1.3"/>
<text x="211" y="52.1" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11.5" font-weight="600" fill="#13294B" text-anchor="middle">1. Debit Aarav</text>
<text x="211" y="66.7" font-family="Plex Mono, IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="8.6" font-weight="400" fill="#5B6575" text-anchor="middle">UPDATE accounts</text>
<text x="211" y="77.8" font-family="Plex Mono, IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="8.6" font-weight="400" fill="#5B6575" text-anchor="middle">SET balance = balance - 5000</text>
<text x="211" y="89" font-family="Plex Mono, IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="8.6" font-weight="400" fill="#5B6575" text-anchor="middle">WHERE account_id = 1</text>
<rect x="328" y="28" width="186" height="78" rx="7" fill="#EAF2FB" stroke="#1F5FA8" stroke-width="1.3"/>
<text x="421" y="52.1" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11.5" font-weight="600" fill="#13294B" text-anchor="middle">2. Credit Isha</text>
<text x="421" y="66.7" font-family="Plex Mono, IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="8.6" font-weight="400" fill="#5B6575" text-anchor="middle">UPDATE accounts</text>
<text x="421" y="77.8" font-family="Plex Mono, IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="8.6" font-weight="400" fill="#5B6575" text-anchor="middle">SET balance = balance + 5000</text>
<text x="421" y="89" font-family="Plex Mono, IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="8.6" font-weight="400" fill="#5B6575" text-anchor="middle">WHERE account_id = 2</text>
<rect x="540" y="34" width="172" height="66" rx="7" fill="#EAF7EF" stroke="#2F7A4D" stroke-width="1.3"/>
<text x="626" y="56.9" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="600" fill="#1F5136" text-anchor="middle">COMMIT</text>
<text x="626" y="72.6" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9.4" font-weight="400" fill="#5B6575" text-anchor="middle">both changes saved</text>
<text x="626" y="84.8" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9.4" font-weight="400" fill="#5B6575" text-anchor="middle">permanently, together</text>
<line x1="96" y1="67" x2="111.8" y2="67" stroke="#475467" stroke-width="1.4" stroke-linecap="round"/>
