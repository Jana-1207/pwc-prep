<polygon points="538,67 532,64.1 532,69.9" fill="#475467" stroke="none" stroke-width="1"/>
<rect x="210" y="170" width="400" height="60" rx="7" fill="#FEF0EF" stroke="#B42318" stroke-width="1.3"/>
<text x="410" y="195.9" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="600" fill="#7A1A12" text-anchor="middle">ROLLBACK</text>
<text x="410" y="211.7" font-family="Plex Sans, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="9.6" font-weight="400" fill="#5B6575" text-anchor="middle">every change since BEGIN is undone — no money is lost or created</text>
